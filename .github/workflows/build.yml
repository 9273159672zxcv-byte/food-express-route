name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.16.0'
        channel: 'stable'
    - run: flutter config --no-analytics
    - run: yes | flutter doctor --android-licenses
    - run: flutter create --project-name food_express_route .
    - run: flutter pub get
    - run: cd android && ./gradlew wrapper --gradle-version=8.9
    - run: keytool -genkey -v -keystore ~/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
    - run: sed -i 's/buildToolsVersion ".*"/buildToolsVersion "34.0.0"/' android/app/build.gradle
    - run: flutter config --jdk-dir=$JAVA_HOME_17_X64
    - run: flutter build apk --release --no-shrink
    - uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: build/app/outputs/flutter-apk/app-release.apk
