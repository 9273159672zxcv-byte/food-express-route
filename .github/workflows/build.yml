workflows:
  android-workflow:
    name: Android Workflow
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Create Android Folder
        script: flutter create --platforms=android .
      - name: Patch Android Manifest
        script: |
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            sed -i '/<application/a \        android:usesCleartextTraffic="true"' "$MANIFEST_PATH"
            echo "Манифест успешно исправлен!"
          else
            echo "Ошибка: файл манифеста не найден!"
          fi
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
